<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌈 Tetris Kids Adventure</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;min-height:100vh;background:linear-gradient(#87ceeb,#dff6ff);text-align:center;overflow-x:hidden}
header{padding:15px}h1{margin:0;font-size:38px;color:#183153;text-shadow:2px 2px white}.subtitle{margin:5px;color:#34495e}
.game-container{display:flex;justify-content:center;align-items:flex-start;gap:20px;flex-wrap:wrap}
canvas{width:300px;height:600px;border:6px solid #183153;border-radius:15px;background:#172033;box-shadow:0 10px 25px rgba(0,0,0,.3)}
.panel{width:230px;background:rgba(255,255,255,.95);border-radius:20px;padding:15px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.card{background:#f1f3f5;border-radius:12px;padding:10px;margin-bottom:10px}.card h3{margin:0 0 5px;color:#183153}.number{font-size:25px;font-weight:bold;color:#1971c2}.mission{background:#fff3bf;border:2px solid #ffd43b}.mission p{margin:5px}
button{border:0;padding:12px 18px;margin:5px;border-radius:12px;background:#339af0;color:white;font-size:17px;font-weight:bold;cursor:pointer;box-shadow:0 4px #1971c2}button:hover{transform:scale(1.05)}button:active{transform:translateY(3px);box-shadow:0 1px #1971c2}.restart{background:#ff6b6b;box-shadow:0 4px #c92a2a}
.keyboard{margin:10px;color:#183153;font-weight:bold}.mobile-controls{display:none}
.village{position:fixed;bottom:0;left:0;width:100%;height:120px;background:#69db7c;z-index:-2}
.house{position:absolute;bottom:20px;width:80px;height:60px;background:#ffd8a8;border:4px solid #7f5539}.house:before{content:"";position:absolute;left:-12px;top:-45px;border-left:52px solid transparent;border-right:52px solid transparent;border-bottom:45px solid #e03131}.door{position:absolute;width:22px;height:35px;background:#8d5524;bottom:0;left:26px}.house1{left:5%}.house2{right:5%}
.farmer{position:fixed;bottom:25px;left:50%;font-size:40px;animation:walk 8s linear infinite alternate;z-index:2}@keyframes walk{from{transform:translateX(-300px)}to{transform:translateX(300px)}}
.star{position:fixed;font-size:28px;animation:float 2s infinite alternate}.star1{top:10%;left:8%}.star2{top:18%;right:10%}.star3{top:8%;right:35%}@keyframes float{from{transform:translateY(0)}to{transform:translateY(-15px)}}
#message{font-weight:bold;color:#e8590c;min-height:25px;margin:5px}
@media(max-width:650px){body{overflow-y:auto}h1{font-size:28px}canvas{width:240px;height:480px}.panel{width:90%;max-width:350px}.mobile-controls{display:block}.keyboard{display:none}.village{height:80px}}
</style>
</head>
<body>
<div class="village"><div class="house house1"><div class="door"></div></div><div class="house house2"><div class="door"></div></div></div>
<div class="farmer">🧑‍🌾</div><div class="star star1">⭐</div><div class="star star2">⭐</div><div class="star star3">⭐</div>
<header><h1>🌈 Tetris Adventure</h1><div class="subtitle">🧩 Help the farmer build the colorful village! 🏡</div></header>
<div class="game-container">
<canvas id="game" width="300" height="600"></canvas>
<div class="panel">
<div class="card"><h3>⭐ Score</h3><div class="number" id="score">0</div></div>
<div class="card"><h3>🏆 High Score</h3><div class="number" id="highScore">0</div></div>
<div class="card"><h3>🚀 Level</h3><div class="number" id="level">1</div></div>
<div class="card"><h3>🪙 Coins</h3><div class="number" id="coins">0</div></div>
<div class="card mission"><h3>🎯 Mission</h3><p>Clear 3 lines!</p><strong id="missionProgress">0 / 3</strong></div>
<div id="message"></div><button class="restart" onclick="restartGame()">🔄 Restart</button>
</div></div>
<div class="keyboard">🎮 Controls: ⬅️ Move Left | ➡️ Move Right | ⬇️ Drop | ⬆️ Rotate | SPACE = ⚡ Fast Drop</div>
<div class="mobile-controls"><button onclick="playerMove(-1)">⬅️</button><button onclick="playerRotate(1)">🔄</button><button onclick="playerMove(1)">➡️</button><br><button onclick="playerDrop()">⬇️</button><button onclick="hardDrop()">⚡</button></div>

<script>
const canvas=document.getElementById("game"),context=canvas.getContext("2d");context.scale(30,30);
const arena=createMatrix(10,20);
const colors=[null,"#ff6b6b","#ffd43b","#69db7c","#74c0fc","#da77f2","#ffa94d","#20c997"];
const player={pos:{x:0,y:0},matrix:null};
let score=0,coins=0,level=1,totalLines=0,dropCounter=0,dropInterval=800,lastTime=0;
let highScore=localStorage.getItem("tetrisHighScore")||0;
document.getElementById("highScore").innerText=highScore;

function createMatrix(w,h){const m=[];while(h--)m.push(new Array(w).fill(0));return m}
function createPiece(t){
 if(t==="T")return[[0,0,0],[1,1,1],[0,1,0]];
 if(t==="O")return[[2,2],[2,2]];
 if(t==="L")return[[0,3,0],[0,3,0],[0,3,3]];
 if(t==="J")return[[0,4,0],[0,4,0],[4,4,0]];
 if(t==="I")return[[5,5,5,5]];
 if(t==="S")return[[0,6,6],[6,6,0],[0,0,0]];
 if(t==="Z")return[[7,7,0],[0,7,7],[0,0,0]];
}
function draw(){context.fillStyle="#172033";context.fillRect(0,0,canvas.width,canvas.height);context.strokeStyle="rgba(255,255,255,.06)";context.lineWidth=.03;for(let x=0;x<10;x++)for(let y=0;y<20;y++)context.strokeRect(x,y,1,1);drawMatrix(arena,{x:0,y:0});drawMatrix(player.matrix,player.pos)}
function drawMatrix(matrix,offset){matrix.forEach((row,y)=>row.forEach((v,x)=>{if(v!==0){context.fillStyle=colors[v];context.fillRect(x+offset.x,y+offset.y,1,1);context.strokeStyle="rgba(255,255,255,.7)";context.lineWidth=.08;context.strokeRect(x+offset.x,y+offset.y,1,1);context.fillStyle="rgba(255,255,255,.3)";context.fillRect(x+offset.x+.12,y+offset.y+.12,.25,.25)}}))}
function collide(arena,p){const m=p.matrix,o=p.pos;for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++)if(m[y][x]!==0&&((arena[y+o.y]&&arena[y+o.y][x+o.x])!==0))return true;return false}
function merge(arena,p){p.matrix.forEach((r,y)=>r.forEach((v,x)=>{if(v!==0)arena[y+p.pos.y][x+p.pos.x]=v}))}
function playerReset(){const pieces="TJLOSZI";player.matrix=createPiece(pieces[pieces.length*Math.random()|0]);player.pos.y=0;player.pos.x=(arena[0].length/2|0)-(player.matrix[0].length/2|0);if(collide(arena,player))gameOver()}
function playerMove(d){player.pos.x+=d;if(collide(arena,player))player.pos.x-=d;playSound(250)}
function playerDrop(){player.pos.y++;if(collide(arena,player)){player.pos.y--;merge(arena,player);arenaSweep();playerReset()}dropCounter=0}
function hardDrop(){while(!collide(arena,player))player.pos.y++;player.pos.y--;merge(arena,player);arenaSweep();playerReset();dropCounter=0;playSound(600)}
function playerRotate(d){const oldX=player.pos.x;let offset=1;rotate(player.matrix,d);while(collide(arena,player)){player.pos.x+=offset;offset=-(offset+(offset>0?1:-1));if(offset>player.matrix[0].length){rotate(player.matrix,-d);player.pos.x=oldX;return}}playSound(400)}
function rotate(m,d){for(let y=0;y<m.length;y++)for(let x=0;x<y;x++)[m[x][y],m[y][x]]=[m[y][x],m[x][y]];if(d>0)m.forEach(r=>r.reverse());else m.reverse()}
function arenaSweep(){let rowCount=1;outer:for(let y=arena.length-1;y>=0;y--){for(let x=0;x<arena[y].length;x++)if(arena[y][x]===0)continue outer;arena.splice(y,1);arena.unshift(new Array(arena[0].length).fill(0));y++;score+=rowCount*100;coins+=rowCount*2;totalLines++;rowCount*=2;playSound(800)}level=Math.floor(totalLines/5)+1;dropInterval=Math.max(120,800-(level-1)*80);updateMission();updateUI()}
function updateMission(){const p=totalLines%3;document.getElementById("missionProgress").innerText=p+" / 3";if(p===0&&totalLines>0){coins+=10;document.getElementById("message").innerText="🎉 Mission Complete! +10 Coins!";setTimeout(()=>document.getElementById("message").innerText="",2000)}}
function updateUI(){document.getElementById("score").innerText=score;document.getElementById("coins").innerText=coins;document.getElementById("level").innerText=level;if(score>highScore){highScore=score;localStorage.setItem("tetrisHighScore",highScore);document.getElementById("highScore").innerText=highScore}}
function gameOver(){context.fillStyle="rgba(0,0,0,.75)";context.fillRect(0,0,10,20);context.fillStyle="white";context.textAlign="center";context.font="bold 1px Arial";context.fillText("GAME OVER!",5,8);context.font=".5px Arial";context.fillText("Press Restart",5,10);playSound(100)}
function restartGame(){arena.forEach(r=>r.fill(0));score=0;coins=0;level=1;totalLines=0;dropInterval=800;document.getElementById("message").innerText="";updateMission();updateUI();playerReset();draw()}
function playSound(f){try{const A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type="sine";g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.15);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.15)}catch(e){}}
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")playerMove(-1);else if(e.key==="ArrowRight")playerMove(1);else if(e.key==="ArrowDown")playerDrop();else if(e.key==="ArrowUp")playerRotate(1);else if(e.code==="Space"){e.preventDefault();hardDrop()}});
function update(time=0){const dt=time-lastTime;lastTime=time;dropCounter+=dt;if(dropCounter>dropInterval)playerDrop();draw();requestAnimationFrame(update)}
restartGame();update();
</script>
</body>
</html>
