<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiddo Tetris 🌈</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: linear-gradient(135deg, #7ee8fa 0%, #eec0c6 50%, #ffd166 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .cloud {
      position: fixed;
      width: 140px;
      height: 50px;
      background: rgba(255,255,255,.6);
      border-radius: 50px;
      filter: blur(.2px);
      z-index: 0;
      animation: float 8s ease-in-out infinite;
    }
    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }
    .cloud::before { width: 60px; height: 60px; left: 20px; top: -25px; }
    .cloud::after { width: 80px; height: 80px; right: 12px; top: -38px; }
    .cloud.c1 { top: 12%; left: 6%; }
    .cloud.c2 { bottom: 10%; right: 7%; animation-delay: -3s; transform: scale(.8); }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-18px); }
    }

    .game-wrap {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 220px 320px;
      gap: 20px;
      padding: 22px;
      border: 6px solid #fff;
      border-radius: 28px;
      background: rgba(255,255,255,.28);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 50px rgba(0,0,0,.2);
    }

    .panel {
      background: rgba(255,255,255,.88);
      border-radius: 22px;
      padding: 18px;
      box-shadow: inset 0 0 0 4px rgba(255,255,255,.7), 0 8px 18px rgba(0,0,0,.12);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 31px;
      line-height: 1;
      color: #ff4d8d;
      text-shadow: 2px 2px 0 #fff, 4px 4px 0 #ffd166;
    }

    .subtitle {
      color: #555;
      font-weight: 700;
      margin-bottom: 14px;
      font-size: 14px;
    }

    .stat {
      background: linear-gradient(135deg, #fff3b0, #ffdd8a);
      border-radius: 14px;
      padding: 10px 12px;
      margin: 8px 0;
      border: 3px solid #fff;
      color: #6b4f00;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
    }

    .next-title {
      margin-top: 14px;
      font-weight: 900;
      color: #5a4fcf;
    }

    #next {
      width: 120px;
      height: 120px;
      display: block;
      margin: 8px auto 12px;
      background: linear-gradient(#eefcff, #fff8fb);
      border-radius: 16px;
      border: 4px solid #c8f2ff;
    }

    .controls {
      font-size: 13px;
      line-height: 1.55;
      font-weight: 700;
      color: #444;
      background: #f5f0ff;
      padding: 10px 12px;
      border-radius: 14px;
    }

    button {
      width: 100%;
      margin-top: 12px;
      border: none;
      border-radius: 14px;
      padding: 12px 10px;
      font: inherit;
      font-weight: 900;
      font-size: 16px;
      color: white;
      background: linear-gradient(135deg, #ff5f8f, #7b61ff);
      box-shadow: 0 7px 0 #5d48c8;
      cursor: pointer;
      transition: .15s ease;
    }
    button:hover { transform: translateY(-2px); }
    button:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 #5d48c8;
    }

    .board-shell {
      position: relative;
      padding: 10px;
      background: linear-gradient(180deg, #1f2c52, #111b35);
      border-radius: 22px;
      border: 6px solid #fff;
      box-shadow: 0 12px 0 #26345d, 0 18px 30px rgba(0,0,0,.18);
    }

    #game {
      display: block;
      width: 300px;
      height: 600px;
      background: #0d1630;
      border-radius: 12px;
    }

    .message {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      background: rgba(20, 15, 50, .82);
      border-radius: 18px;
      color: white;
      font-size: 27px;
      font-weight: 900;
      text-shadow: 2px 2px #000;
    }

    .message span {
      display: block;
      font-size: 15px;
      margin-top: 10px;
      color: #ffe88b;
    }

    .sparkle {
      position: fixed;
      font-size: 26px;
      animation: twinkle 1.6s infinite ease-in-out;
      z-index: 1;
    }
    .s1 { top: 9%; right: 17%; }
    .s2 { bottom: 8%; left: 14%; animation-delay: -.6s; }
    .s3 { top: 24%; left: 2%; animation-delay: -1s; }
    @keyframes twinkle {
      0%,100% { transform: scale(1) rotate(0); opacity:.6; }
      50% { transform: scale(1.4) rotate(12deg); opacity:1; }
    }

    @media (max-width: 620px) {
      body { align-items: flex-start; padding: 12px; overflow: auto; }
      .game-wrap {
        grid-template-columns: 1fr;
        width: min(95vw, 360px);
      }
      .panel { order: 2; }
      .board-shell { order: 1; }
      #game { width: 100%; height: auto; aspect-ratio: 1 / 2; }
    }
  </style>
</head>
<body>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="sparkle s1">⭐</div>
  <div class="sparkle s2">🌟</div>
  <div class="sparkle s3">✨</div>

  <div class="game-wrap">
    <div class="panel">
      <h1>Kiddo Tetris 🌈</h1>
      <div class="subtitle">Build, blast lines, and beat your high score!</div>

      <div class="stat"><span>⭐ Score</span><span id="score">0</span></div>
      <div class="stat"><span>🏆 Best</span><span id="best">0</span></div>
      <div class="stat"><span>🚀 Level</span><span id="level">1</span></div>
      <div class="stat"><span>🎯 Lines</span><span id="lines">0</span></div>

      <div class="next-title">Next Block 👀</div>
      <canvas id="next" width="120" height="120"></canvas>

      <div class="controls">
        ⬅️ ➡️ Move<br>
        ⬆️ Rotate<br>
        ⬇️ Soft drop<br>
        Space = Super drop<br>
        P = Pause
      </div>

      <button id="restart">🎮 Start / Restart</button>
    </div>

    <div class="board-shell">
      <canvas id="game" width="300" height="600"></canvas>
      <div class="message" id="message">
        GAME OVER 😵
        <span>Press Start / Restart and try again!</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const nextCanvas = document.getElementById("next");
    const nextCtx = nextCanvas.getContext("2d");

    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 30;

    const colors = [
      null,
      "#ff5d8f",
      "#52d273",
      "#4cc9f0",
      "#ffd166",
      "#9b5de5",
      "#f78c6b",
      "#00c2a8"
    ];

    const pieces = {
      T: [[0,0,0],[1,1,1],[0,1,0]],
      O: [[2,2],[2,2]],
      L: [[0,3,0],[0,3,0],[0,3,3]],
      J: [[0,4,0],[0,4,0],[4,4,0]],
      I: [[0,0,0,0],[5,5,5,5],[0,0,0,0],[0,0,0,0]],
      S: [[0,6,6],[6,6,0],[0,0,0]],
      Z: [[7,7,0],[0,7,7],[0,0,0]]
    };

    const arena = createMatrix(COLS, ROWS);
    let player;
    let nextPiece;
    let dropCounter = 0;
    let dropInterval = 700;
    let lastTime = 0;
    let paused = false;
    let running = false;
    let score = 0;
    let lines = 0;
    let level = 1;
    let best = Number(localStorage.getItem("kiddoTetrisBest") || 0);

    document.getElementById("best").textContent = best;

    function createMatrix(w, h) {
      return Array.from({ length: h }, () => new Array(w).fill(0));
    }

    function randomPiece() {
      const keys = "TJLOSZI";
      const key = keys[Math.floor(Math.random() * keys.length)];
      return {
        matrix: pieces[key].map(row => [...row]),
        pos: { x: 0, y: 0 }
      };
    }

    function resetPlayer() {
      player = nextPiece || randomPiece();
      nextPiece = randomPiece();
      player.pos.y = 0;
      player.pos.x = Math.floor(COLS / 2 - player.matrix[0].length / 2);
      drawNext();

      if (collide(arena, player)) {
        gameOver();
      }
    }

    function collide(arena, player) {
      const m = player.matrix;
      const o = player.pos;
      for (let y = 0; y < m.length; y++) {
        for (let x = 0; x < m[y].length; x++) {
          if (m[y][x] !== 0 &&
              (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0 && arena[y + player.pos.y]) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function sweep() {
      let cleared = 0;
      outer:
      for (let y = arena.length - 1; y >= 0; y--) {
        for (let x = 0; x < arena[y].length; x++) {
          if (arena[y][x] === 0) continue outer;
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        y++;
        cleared++;
      }

      if (cleared) {
        const rewards = [0, 100, 300, 500, 800];
        score += rewards[cleared] * level;
        lines += cleared;
        level = Math.floor(lines / 10) + 1;
        dropInterval = Math.max(130, 700 - (level - 1) * 60);
        updateHUD();
      }
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; y++) {
        for (let x = 0; x < y; x++) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) matrix.forEach(row => row.reverse());
      else matrix.reverse();
    }

    function playerRotate(dir) {
      const oldX = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (Math.abs(offset) > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = oldX;
          return;
        }
      }
    }

    function playerMove(dir) {
      player.pos.x += dir;
      if (collide(arena, player)) player.pos.x -= dir;
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        sweep();
        resetPlayer();
      }
      dropCounter = 0;
    }

    function hardDrop() {
      if (!running || paused) return;
      let distance = 0;
      while (!collide(arena, player)) {
        player.pos.y++;
        distance++;
      }
      player.pos.y--;
      distance--;
      score += Math.max(0, distance) * 2;
      merge(arena, player);
      sweep();
      resetPlayer();
      updateHUD();
      dropCounter = 0;
    }

    function drawCell(context, x, y, value, size) {
      context.fillStyle = colors[value];
      context.fillRect(x * size, y * size, size, size);

      const grad = context.createLinearGradient(
        x * size, y * size,
        (x + 1) * size, (y + 1) * size
      );
      grad.addColorStop(0, "rgba(255,255,255,.45)");
      grad.addColorStop(.45, "rgba(255,255,255,.04)");
      grad.addColorStop(1, "rgba(0,0,0,.18)");
      context.fillStyle = grad;
      context.fillRect(x * size + 2, y * size + 2, size - 4, size - 4);

      context.strokeStyle = "rgba(255,255,255,.65)";
      context.lineWidth = 2;
      context.strokeRect(x * size + 2, y * size + 2, size - 4, size - 4);
    }

    function drawMatrix(matrix, offset, context, size) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) drawCell(context, x + offset.x, y + offset.y, value, size);
        });
      });
    }

    function drawGrid() {
      ctx.strokeStyle = "rgba(255,255,255,.06)";
      ctx.lineWidth = 1;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x * BLOCK, 0);
        ctx.lineTo(x * BLOCK, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * BLOCK);
        ctx.lineTo(canvas.width, y * BLOCK);
        ctx.stroke();
      }
    }

    function draw() {
      const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
      bg.addColorStop(0, "#182858");
      bg.addColorStop(1, "#09112a");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawGrid();
      drawMatrix(arena, {x:0, y:0}, ctx, BLOCK);

      if (player) {
        const ghost = {
          matrix: player.matrix,
          pos: {x: player.pos.x, y: player.pos.y}
        };
        while (!collide(arena, ghost)) ghost.pos.y++;
        ghost.pos.y--;

        ctx.save();
        ctx.globalAlpha = .20;
        drawMatrix(ghost.matrix, ghost.pos, ctx, BLOCK);
        ctx.restore();

        drawMatrix(player.matrix, player.pos, ctx, BLOCK);
      }

      if (paused && running) {
        ctx.fillStyle = "rgba(10,10,35,.65)";
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "white";
        ctx.font = "bold 36px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText("PAUSED 😴", canvas.width/2, canvas.height/2);
      }
    }

    function drawNext() {
      nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
      nextCtx.fillStyle = "#f7fdff";
      nextCtx.fillRect(0,0,nextCanvas.width,nextCanvas.height);

      if (!nextPiece) return;
      const size = 24;
      const w = nextPiece.matrix[0].length * size;
      const h = nextPiece.matrix.length * size;
      const ox = (nextCanvas.width - w) / 2 / size;
      const oy = (nextCanvas.height - h) / 2 / size;
      drawMatrix(nextPiece.matrix, {x: ox, y: oy}, nextCtx, size);
    }

    function updateHUD() {
      document.getElementById("score").textContent = score;
      document.getElementById("lines").textContent = lines;
      document.getElementById("level").textContent = level;

      if (score > best) {
        best = score;
        localStorage.setItem("kiddoTetrisBest", best);
        document.getElementById("best").textContent = best;
      }
    }

    function gameOver() {
      running = false;
      document.getElementById("message").style.display = "flex";
      updateHUD();
    }

    function startGame() {
      for (let y = 0; y < arena.length; y++) arena[y].fill(0);
      score = 0;
      lines = 0;
      level = 1;
      dropInterval = 700;
      paused = false;
      running = true;
      nextPiece = randomPiece();
      resetPlayer();
      updateHUD();
      document.getElementById("message").style.display = "none";
    }

    function update(time = 0) {
      const delta = time - lastTime;
      lastTime = time;

      if (running && !paused) {
        dropCounter += delta;
        if (dropCounter > dropInterval) playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    document.addEventListener("keydown", e => {
      if (!running && e.key !== "Enter") return;

      if (e.key === "p" || e.key === "P") {
        paused = !paused;
        return;
      }
      if (paused) return;

      if (e.key === "ArrowLeft") playerMove(-1);
      else if (e.key === "ArrowRight") playerMove(1);
      else if (e.key === "ArrowDown") {
        playerDrop();
        score += 1;
        updateHUD();
      }
      else if (e.key === "ArrowUp") playerRotate(1);
      else if (e.code === "Space") {
        e.preventDefault();
        hardDrop();
      }
    });

    document.getElementById("restart").addEventListener("click", startGame);

    startGame();
    update();
  </script>
</body>
</html>
